name: Badges

# Count the results of the CI jobs of the caller per kind (sim_*, lint_*,
# syn_*) and publish them as shields.io endpoint files (sim.json, lint.json,
# syn.json) on the orphan branch "badges" of the calling repository. The
# branch holds a single commit, replaced only when a count changes.
#
# Caller (generated by `make ci_generate`, after all the target jobs) :
#   badges:
#     needs: [sim_..., lint_..., syn_...]
#     if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
#     permissions:
#       contents: write
#     uses: deuskane/asylum-ci/.github/workflows/badges.yml@main
#     with:
#       results: ${{ toJSON(needs) }}
#
# README badge :
#   https://img.shields.io/endpoint?url=https://raw.githubusercontent.com/<owner>/<repo>/badges/sim.json

on:
  workflow_call:
    inputs:
      results:
        description: toJSON(needs) of the caller
        required: true
        type: string

jobs:
  badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Count the results
        env:
          RESULTS: ${{ inputs.results }}
        run: |
          mkdir badges
          cd badges
          python3 - <<'EOF'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          for kind in ("sim", "lint", "syn"):
              jobs = [job["result"] for name, job in results.items() if name.startswith(kind + "_")]
              if not jobs:
                  continue
              passed  = jobs.count("success")
              failed  = len(jobs) - passed
              message = f"{passed} passed / {len(jobs)}" if failed == 0 else f"{passed} passed, {failed} failed / {len(jobs)}"
              badge   = {"schemaVersion": 1,
                         "label"        : kind,
                         "message"      : message,
                         "color"        : "brightgreen" if failed == 0 else "red"}
              with open(f"{kind}.json", "w") as f:
                  json.dump(badge, f)
              print(kind, ":", message)
          EOF
          echo "Generated by the CI for the README badges, do not edit." > README.md

      - name: Publish on the badges branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd badges
          git init -q -b badges
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Badges of ${GITHUB_SHA::7}"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Same counts as the published ones : nothing to push
          if git fetch -q --depth 1 "$remote" badges 2>/dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "Badges unchanged"
          else
            git push -q --force "$remote" HEAD:badges
          fi
