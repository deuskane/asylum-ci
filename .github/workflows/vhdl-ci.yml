name: Shared VHDL CI

on:
  workflow_call:
    inputs:
      target_name:
        required: false
        type: string
        default: nonreg

build-and-test:
  runs-on: ubuntu-latest
  container:
    image: ghcr.io/${{ github.repository_owner }}/asylum-env:latest
    credentials:
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
  steps:
    - uses: actions/checkout@v4
    # Enregistrement de la librairie locale pour FuseSoC
    - name: FuseSoC library
      run: |
        cd "$GITHUB_WORKSPACE"
        fusesoc library add lib https://github.com/deuskane/asylum-cores
        fusesoc library add ip  .
    # Compilation et exécution parallèle via Makefile
    - name: Simulation
      run: |
        make -j"$(nproc)" "${{ inputs.target_name }}" 2>&1 | tee simulation.log
